name: CI

on:
  push:
    branches: [main, "boss/**", "fix/**", "feat/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_build:
        description: "Run production build"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  grok-migration:
    name: Import full Grok Build core
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Expose master agent token to Grok tools
        env:
          MASTER_TOKEN: ${{ secrets.MASTER_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${MASTER_TOKEN:-}" ]; then
            echo "MASTER_TOKEN secret is not configured; continuing without printing or synthesizing a token."
          else
            echo "MASTER_TOKEN is available to this job; value is masked by GitHub Actions."
          fi
      - name: Import Grok Build source
        shell: bash
        run: |
          set -euo pipefail
          if [ -f vendor/grok-build/Cargo.toml ] && grep -q "Full upstream xai-org/grok-build source" GROK_BUILD_INTEGRATION.md 2>/dev/null; then
            echo "Grok Build source already imported"
            exit 0
          fi
          tmp="$(mktemp -d)"
          git clone --depth=1 https://github.com/xai-org/grok-build.git "$tmp/grok-build"
          rm -rf "$tmp/grok-build/.git"
          rm -rf vendor/grok-build
          mkdir -p vendor
          cp -a "$tmp/grok-build" vendor/grok-build
          rm -rf src/lib/boss-engine src/lib/agent-loop.ts src/lib/agent.functions.ts src/lib/bossnugrok
          rm -rf src/lib/github-agent-tools.server.ts src/lib/github-tool-bridge.ts src/lib/github-tools-expand.ts src/lib/puter-tool-loader.ts
          mkdir -p src/lib/puter-integration
          cp src/lib/puter.ts src/lib/puter-models.ts src/lib/puter-context.tsx src/lib/model-gateway.server.ts src/lib/puter-integration/ 2>/dev/null || true
          printf '%s\n' '# Grok Build Agent Core' '' 'Full upstream xai-org/grok-build source is vendored under vendor/grok-build.' '' 'Puter Login and Puter AI remain the user-facing authentication and model gateway.' > GROK_BUILD_INTEGRATION.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'feat(agent): replace legacy core with upstream Grok Build'
          git push origin main

  quality:
    name: Typecheck · Test · Lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint
        continue-on-error: true

  build:
    name: Production build
    needs: quality
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_build }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm install --no-audit --no-fund

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ github.sha }}
          path: |
            .output
            dist
          if-no-files-found: warn
          retention-days: 7

  summary:
    name: CI summary
    needs: [quality, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report
        run: |
          echo "### Panupan33 CI" >> $GITHUB_STEP_SUMMARY
          echo "- quality: **${{ needs.quality.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "- build: **${{ needs.build.result }}**" >> $GITHUB_STEP_SUMMARY
          echo "- commit: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- ref: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          if [ "${{ needs.quality.result }}" != "success" ]; then exit 1; fi
          if [ "${{ needs.build.result }}" != "success" ] && [ "${{ needs.build.result }}" != "skipped" ]; then exit 1; fi
