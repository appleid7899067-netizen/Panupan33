name: Boss MVP Verification

on:
  push:
    branches: ["main", "boss-mvp-hardening-20260921"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: boss-mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Auth invariant
        run: npm run check:auth

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
