name: Boss MVP Verification

on:
  push:
    branches: ["main", "boss-mvp-full-20260921"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: boss-mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
