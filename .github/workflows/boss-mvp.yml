name: Boss MVP Verification

on:
  push:
    branches: ["main", "boss-mvp-hardening-20260921"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: boss-mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Start dev server
        run: |
          nohup npm run dev > /tmp/boss-dev.log 2>&1 &
          echo $! > /tmp/boss-dev.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:8080/__app-env > /tmp/app-env.json; then
              echo "Dev server ready"
              cat /tmp/app-env.json
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:8080/__app-env

      - name: Auth invariant
        run: npm run check:auth -- --dev-url http://127.0.0.1:8080

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
