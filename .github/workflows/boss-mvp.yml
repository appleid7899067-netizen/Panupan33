name: Boss MVP Verification

on:
  push:
    branches: ["main", "boss-clean-rebuild-20260922"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: boss-mvp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Start production preview
        run: |
          nohup npm run preview > /tmp/boss-preview.log 2>&1 &
          echo $! > /tmp/boss-preview.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ > /tmp/boss-home.html; then
              echo "Preview ready"
              break
            fi
            sleep 2
          done
          curl -fsS http://127.0.0.1:4173/ > /tmp/boss-home.html
          test -s /tmp/boss-home.html
