name: Bossnu Tests
on:
  push:
    paths: ['bossnu/**']
  pull_request:
    paths: ['bossnu/**']
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bossnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - run: PYTHONPATH=. python tests/test_gate.py
